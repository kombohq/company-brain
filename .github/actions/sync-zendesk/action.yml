name: Sync Zendesk Help Center
description: >-
  Mirror a Zendesk Help Center's published articles into the given directory as
  markdown and commit the result. Uses the anonymous public API (no token). Use
  one step (or one workflow) per Help Center, each passing its own subdomain and
  directory, to mirror several into the context.

inputs:
  subdomain:
    description: The "X" in X.zendesk.com (e.g. "acme").
    required: true
  directory:
    description: Directory to sync into, relative to the repo root (e.g. "context/acme").
    required: true
  locale:
    description: Guide locale segment, e.g. "en-us" (optional).
    required: false
    default: "en-us"
  commit-message:
    description: 'Commit message for the synced changes. Defaults to "chore: sync <subdomain> help center".'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Sync Zendesk Help Center
      shell: bash
      env:
        ZENDESK_SUBDOMAIN: ${{ inputs.subdomain }}
        ZENDESK_LOCALE: ${{ inputs.locale }}
        ZENDESK_OUT_DIR: ${{ inputs.directory }}
      run: bun run zendesk:sync

    - name: Commit and push changes
      uses: ./.github/actions/commit-and-push
      with:
        message: "${{ inputs.commit-message || format('chore: sync {0} help center', inputs.subdomain) }}"
        paths: "${{ inputs.directory }}/**"
