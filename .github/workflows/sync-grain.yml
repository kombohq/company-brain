# Requires repo secret GRAIN_API_KEY (a Personal or Workspace Access Token created
# at Grain → Settings → Integrations → API). A Personal token mirrors only your
# own recordings; a Workspace token mirrors all recordings in the workspace.
#
# This workflow syncs one Grain account via the reusable ./.github/actions/sync-grain
# action. To sync more accounts, either add another step below or copy this file; in each
# case point the step at a different secret and directory, and give each workflow its own
# concurrency group.
name: Sync Grain

on:
  # Uncomment to enable automatic daily sync.
  # schedule:
  #   # 04:25 UTC daily.
  #   - cron: "25 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-context-sync-grain
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/sync-grain
        with:
          grain-api-key: ${{ secrets.GRAIN_API_KEY }}
          directory: context/grain
