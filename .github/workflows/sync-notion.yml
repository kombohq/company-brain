# Requires repo secret NOTION_TOKEN (internal integration token with "Read content"
# and "Read user information including email addresses" capabilities). Only pages and
# databases shared with the integration are synced. See .env.example for setup.
#
# This workflow syncs one Notion integration via the reusable ./.github/actions/sync-notion
# action. To sync more integrations, either add another step below or copy this file; in
# each case point the step at a different secret and directory, and give each workflow its
# own concurrency group.
name: Sync Notion

on:
  # Uncomment to enable automatic daily sync.
  # schedule:
  #   # 03:30 UTC daily.
  #   - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = only refetch changed pages; full = refetch all"
        type: choice
        options:
          - incremental
          - full
        default: incremental

concurrency:
  group: ${{ github.repository }}-context-sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/sync-notion
        with:
          notion-token: ${{ secrets.NOTION_TOKEN }}
          directory: context/notion
          mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'incremental' }}
