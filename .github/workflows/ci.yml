name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # release.sh reads/writes package.json via bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: TypedDevs/bashunit@v0
        with:
          version: "0.40.0"

      - name: Test shell scripts
        run: bashunit scripts/tests
